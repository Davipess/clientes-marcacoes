[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Edge Functions — rate limiting for public API endpoints
[[edge_functions]]
  path = "/api/loyalty"
  function = "rate-limit"

[[edge_functions]]
  path = "/api/loyalty/*"
  function = "rate-limit"

[[edge_functions]]
  path = "/api/waitlist"
  function = "rate-limit"

[[edge_functions]]
  path = "/api/push/subscribe"
  function = "rate-limit"

[[edge_functions]]
  path = "/api/marcacoes"
  function = "rate-limit"

# Nota: as migrações da base de dados NÃO correm no deploy automático.
# Aplicar com `npx prisma migrate deploy` (local ou CI) antes de promover
# tráfego — ver docs/DEPLOY.md.
